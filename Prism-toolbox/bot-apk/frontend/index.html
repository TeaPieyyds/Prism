<div class="conn-bar" id="conn-bar">
  <div class="cb-left"><h1>prism工具箱</h1></div>
  <div class="cb-center">
    <span class="cb-dot" id="gdot"></span>
    <span class="cb-status" id="conn-st">未连接</span>
  </div>
  <div class="cb-right">
    <span class="cb-server" id="conn-srv"></span>
    <button class="cb-btn" onclick="tabTo('settings')" title="设置">&#9879;</button>
  </div>
</div>

<div class="content show" id="tab-home"><div class="content-inner" id="tab-home-inner"></div></div>
<div class="content" id="tab-tasks"><div class="content-inner" id="tab-tasks-inner"></div></div>
<div class="content" id="tab-terminal"><div class="content-inner" id="tab-terminal-inner"></div></div>
<div class="content" id="tab-settings"><div class="content-inner" id="tab-settings-inner"></div></div>
<div class="sub-page" id="sub-page"></div>

<div class="nav" id="bottom-nav">

<div class="wz-overlay" id="wizard-overlay" style="display:none">
  <div class="wz-bg">
    <div class="wz-blob wz-blob-gold"></div>
    <div class="wz-blob wz-blob-green"></div>
    <div class="wz-blob wz-blob-brown"></div>
    <div class="wz-dots"></div>
    <div class="wz-noise"></div>
    <div class="wz-lines"></div>
  </div>
  <div class="wz-content">
    <div class="wz-pages">
      <div class="wz-page active" id="wz-page-1"></div>
      <div class="wz-page" id="wz-page-2"></div>
      <div class="wz-page" id="wz-page-3"></div>
      <div class="wz-page" id="wz-page-4"></div>
    </div>
    <div class="wz-dot-bar" id="wz-dot-bar">
      <span class="wz-dot active" onclick="goToStep(1)"></span>
      <span class="wz-dot" onclick="goToStep(2)"></span>
      <span class="wz-dot" onclick="goToStep(3)"></span>
      <span class="wz-dot" onclick="goToStep(4)"></span>
    </div>
  </div>
</div>
