plugins {
    id 'com.android.application'
}

android {
    namespace 'com.prismtool.box'
    compileSdk 34

    defaultConfig {
        applicationId "com.prismtool.box"
        minSdk 26
        targetSdk 33
        versionCode 102
        versionName "1.0.4-beta.50"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.9.0'
}
